[graph]
all-features = true

[advisories]
version = 2
# CI passes `--warn unmaintained`, so unmaintained crates are reported but do not fail the check.
unmaintained = "all"
yanked = "deny"
ignore = [
    # rsa (no fixed release) comes with the GCS and Azure object-store backends (features `gcs`,
    # `azure`), where it signs credential requests. The timing attack needs an attacker measuring
    # many RSA decryptions, which never happen here.
    { id = "RUSTSEC-2023-0071", reason = "rsa signs object-store credential requests only; no decryption oracle" },
    # paste (archived, no fixed release) is a compile-time macro crate that lance-bitpacking and
    # nalgebra's simba (via lance-index) use; it generates code at build time and never sees runtime
    # input. Drop once Lance moves off it.
    { id = "RUSTSEC-2024-0436", reason = "paste via lance-bitpacking and simba (lance-index); build-time macro only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # kv0 (storage) is a git dependency until it is published; it then moves to crates.io and this
    # entry goes away.
    "https://github.com/sayef/kv0",
]
