[graph]
all-features = true

[advisories]
version = 2
# CI passes `--warn unmaintained`, so unmaintained crates are reported but do not fail the check.
unmaintained = "all"
yanked = "deny"
ignore = [
    # quick-xml 0.39 comes with object_store 0.13 (S3 access in moraine, DataFusion and delta-rs),
    # and no fixed release fits the range object_store accepts. It parses only S3 responses from
    # the configured endpoint. Drop both once object_store moves on.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 via object_store 0.13: quadratic attribute checks; parses only S3 responses" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 via object_store 0.13: unbounded namespace declarations; parses only S3 responses" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # libbz2-rs-sys (DataFusion's compression codecs, through moraine): the permissive bzip2 licence
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
