name: Benchmarks

# Logs synthetic runs with bench/scale.py and times the server's API with bench/scale.sh, on demand:
# by hand, or on a pull request labelled `bench`. Report-only: shared runners are noisy, so the
# numbers go to the job summary and never fail the build.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs to log
        default: "1000"
      points:
        description: Points per run
        default: "1000"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  scale:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: cargo build --release -p vigily-cli -p vigily-server
      - run: uv sync
      - name: Log synthetic runs and time the API
        env:
          RUNS: ${{ inputs.runs || '1000' }}
          POINTS: ${{ inputs.points || '1000' }}
          # The SDK logs through an engine it starts; scale.sh then serves the repository itself.
          VIGILY_ENGINE: target/release/vigily-engine
          VIGILY_STATE_DIR: ${{ runner.temp }}/state
        run: |
          {
            echo "## Scale benchmark: $RUNS runs, $POINTS points each"
            echo
            echo '```'
            uv run --no-sync python bench/scale.py --runs "$RUNS" --points "$POINTS" --repo "$RUNNER_TEMP/scale"
            target/release/vigily stop --repo "$RUNNER_TEMP/scale" >/dev/null
            bash bench/scale.sh "$RUNNER_TEMP/scale"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
