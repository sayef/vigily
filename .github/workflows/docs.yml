name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No dependency cache: this job publishes the site (zizmor: cache-poisoning).
          enable-cache: false
      - run: uvx --with-requirements docs/requirements.txt mkdocs build --strict
      # main publishes the site to Cloudflare Pages (vigily.pages.dev); pull requests only build it.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create vigily --production-branch=main || true
          command: pages deploy site --project-name=vigily --branch=main
