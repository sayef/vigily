version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    # Only versions that have been public for a week.
    cooldown: { default-days: 7 }
    # Patch and minor updates arrive together; each major version gets its own pull request.
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /crates/vigily-ui
    schedule: { interval: weekly }
    # Only versions that have been public for two weeks.
    cooldown: { default-days: 14 }
    groups:
      ui:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not accept TypeScript 7 yet, so `npm ci` fails on it. Remove this
      # once a typescript-eslint release lists 7 in its peer range.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
