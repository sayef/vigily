[package]
name = "vigily-cli"
description = "The vigily command: a client of the engine that serves a repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "vigily"
path = "src/main.rs"

[lib]
name = "vigily_cli"
path = "src/lib.rs"

# The command line talks HTTP only: storage, the web app and the engine are not in its tree
# (CI checks that neither vigily-core nor kv0 is). Object-store support lives in vigily-engine.
[dependencies]
vigily-api = { workspace = true, features = ["client"] }
anyhow.workspace = true
clap.workspace = true
# `vigily sync` reads the Python SDK's spool: gzip-compressed NDJSON.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# Tests run the commands against an engine in the same process.
vigily-server.workspace = true
vigily-core.workspace = true
tempfile.workspace = true
async-trait.workspace = true
