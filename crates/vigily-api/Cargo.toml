[package]
name = "vigily-api"
description = "vigily's HTTP API: the requests and answers the engine, the web app, the CLI and the SDK share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The typed HTTP client for `/api/v1` and finding (or starting) a repository's local engine.
client = ["dep:reqwest", "dep:flate2", "dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The key of a repository's engine files (`local`); already in the tree through vigily-core.
sha2.workspace = true
# The client (feature `client`): HTTP with rustls and gzip answers, gzip request bodies, waiting.
# All three are already in the tree through the engine.
reqwest = { workspace = true, optional = true, features = ["gzip"] }
flate2 = { version = "1", optional = true }
tokio = { workspace = true, optional = true }
