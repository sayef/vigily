[package]
name = "vigily-py"
description = "Python bindings for vigily: log runs, parameters and metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Object-store backends, as for the CLI: `maturin develop --features s3`.
s3 = ["vigily-core/s3"]
gcs = ["vigily-core/gcs"]
azure = ["vigily-core/azure"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py311"] }
vigily-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# Not on macOS, where every mimalloc in a process shares fixed thread slots and pyarrow ships one.
[target.'cfg(target_os = "linux")'.dependencies]
# `local_dynamic_tls`: the module is loaded with dlopen, where initial-exec TLS can exhaust the
# static TLS block ("cannot allocate memory in static TLS block").
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
