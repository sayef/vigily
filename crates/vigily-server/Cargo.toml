[package]
name = "vigily-server"
description = "vigily's HTTP API and the embedded web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
vigily-core.workspace = true
vigily-ui.workspace = true
axum.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
# Schedules: cron expressions, IANA time zones, the operator's TOML config; webhooks for alerts.
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true
toml.workspace = true
reqwest.workspace = true

[target.'cfg(unix)'.dependencies]
# Kill a timed-out schedule's whole process group.
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
http-body-util = "0.1"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"
