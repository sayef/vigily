[package]
name = "vigily-server"
description = "vigily's HTTP API and the embedded web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "vigily-engine"
path = "src/main.rs"

[features]
default = []
# Object-store backends (see vigily-core's features): S3 is always built in, GCS and Azure are not
# supported by kv0 yet. Kept so that builds selecting them keep working.
s3 = ["vigily-core/s3"]
gcs = ["vigily-core/gcs"]
azure = ["vigily-core/azure"]

[dependencies]
vigily-api.workspace = true
vigily-core.workspace = true
vigily-ui.workspace = true
axum.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
# The vigily-engine binary: its flags, errors and log output.
anyhow.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
# Schedules: cron expressions, IANA time zones, the operator's TOML config; webhooks for alerts.
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true
toml.workspace = true
reqwest.workspace = true
# Streams NDJSON response bodies (already in the tree through axum and reqwest).
futures-util = { version = "0.3", default-features = false }
# Random local tokens and access tokens (already in the tree through kv0's dependencies).
getrandom = "0.3"
# Encrypting stored webhook URLs and passwords: the XChaCha20-Poly1305 AEAD from RustCrypto (pure
# Rust, audited) seals each value, and BLAKE3's key derivation turns the operator's key into the
# 256-bit sealing key (blake3 is already in the tree through DataFusion).
chacha20poly1305 = "0.11"
blake3 = "1"
# Alert channels. E-mail over SMTP with STARTTLS or TLS through rustls (the TLS stack reqwest
# already uses); no native TLS or OpenSSL.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
# The HMAC-SHA256 signature of generic webhook deliveries (both already in the tree).
hmac = "0.12"
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# Kill a timed-out schedule's whole process group.
libc = "0.2"

[dev-dependencies]
# The typed client, tested against this engine.
vigily-api = { workspace = true, features = ["client"] }
async-trait.workspace = true
tempfile.workspace = true
tower.workspace = true
http-body-util = "0.1"
# Gzip request bodies in the ingest tests (already in the tree through tower-http).
flate2 = "1"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"
