[package]
name = "vigily-core"
description = "vigily's domain model: runs, parameters, metric series, run queries, downsampling and aggregation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["kv0"]
# The kv0 storage adapter. Without it only the in-memory store is available (tests, embedding).
kv0 = ["dep:kv0"]
# Object-store backends for kv0 (local files and memory:// are always available).
s3 = ["kv0?/aws"]
gcs = ["kv0?/gcp"]
azure = ["kv0?/azure"]

[dependencies]
vigily-api.workspace = true
kv0 = { workspace = true, optional = true }
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# Stable content hashes for dataset items and versions (std's hasher is not stable across builds).
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
lance.workspace = true
arrow-array.workspace = true
tokio.workspace = true
