[workspace]
resolver = "2"
members = [
    "crates/vigily-api",
    "crates/vigily-core",
    "crates/vigily-server",
    "crates/vigily-ui",
    "crates/vigily-cli",
]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Saiful Islam"]
repository = "https://github.com/sayef/vigily"
homepage = "https://github.com/sayef/vigily"

[workspace.dependencies]
vigily-api = { path = "crates/vigily-api", version = "0.1.0-beta.2" }
vigily-core = { path = "crates/vigily-core", version = "0.1.0-beta.2" }
vigily-server = { path = "crates/vigily-server", version = "0.1.0-beta.2" }
vigily-ui = { path = "crates/vigily-ui", version = "0.1.0-beta.2" }
# Storage: kv0 (moraine databases of Delta Lake tables on local disk or S3), from crates.io. To build
# against a local kv0 checkout instead, see "Storage dependency" in CONTRIBUTING.md. A pre-release
# needs its exact version here: "0.1" does not match 0.1.0-beta.3.
kv0 = { version = "0.1.0-beta.3", default-features = false }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["compression-gzip", "decompression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
tempfile = "3"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
croner = "2"
toml = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep target/ small: no debug info for third-party crates, line tables for ours.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
