# Pre-commit hooks for vigily. Install with either runner:
#   pipx install pre-commit && pre-commit install     # the Python tool
#   cargo install prek && prek install                # Rust-native, reads this same file
minimum_pre_commit_version: "3.0.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Spelling; configured in _typos.toml.
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.0
    hooks:
      - id: typos

  # GitHub Actions workflows: syntax and expressions (actionlint), security (zizmor).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  # The Dockerfile.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      # A fresh clone has no node_modules; install them from the lockfile (git-ignored, so the
      # hook still leaves the tree unchanged) instead of failing with `eslint: not found`.
      - id: ui-lint
        name: eslint (web app)
        entry: >-
          bash -c 'cd crates/vigily-ui &&
          if [ ! -x node_modules/.bin/eslint ]; then
          echo "ui-lint: node_modules missing, running npm ci in crates/vigily-ui" >&2;
          npm ci --no-audit --no-fund --loglevel=error ||
          { echo "ui-lint: npm ci failed; run it in crates/vigily-ui and retry" >&2; exit 1; };
          fi &&
          npm run -s lint'
        language: system
        files: ^crates/vigily-ui/(src|scripts)/
        pass_filenames: false
