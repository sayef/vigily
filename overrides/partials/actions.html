{% if page.vg_source and not page.is_homepage %}
  <button type="button" class="md-content__button vg-copy-page" data-vg-copy-page title="Copy this page as Markdown">
    {% include ".icons/material/content-copy.svg" %}<span>Copy page</span>
  </button>
  <textarea hidden class="vg-source">{{ page.vg_source | e }}</textarea>
{% endif %}
{% if page.edit_url and "content.action.edit" in features %}
  <a href="{{ page.edit_url }}" title="{{ lang.t('action.edit') }}" class="md-content__button md-icon" rel="edit">
    {% include ".icons/" ~ (config.theme.icon.edit or "material/file-edit-outline") ~ ".svg" %}
  </a>
{% endif %}
