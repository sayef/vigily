[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vigily"
description = "An experiment tracker that keeps watch: log runs, metrics and evaluations from Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saiful Islam" }]
requires-python = ">=3.11"
keywords = ["experiment-tracking", "machine-learning", "mlops", "metrics", "hyperparameters"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# No runtime dependencies: the SDK speaks HTTP with the standard library.
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/sayef/vigily"
Issues = "https://github.com/sayef/vigily/issues"
Changelog = "https://github.com/sayef/vigily/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

# The version is the workspace's (Cargo.toml): 0.1.0-beta.3 there is 0.1.0b3 here.
[tool.hatch.version]
path = "Cargo.toml"
pattern = '(?m)^\[workspace\.package\]\s*\nversion = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["python/vigily"]

[tool.hatch.build.targets.sdist]
include = ["python/vigily", "python/tests", "README.md", "LICENSE", "CHANGELOG.md", "Cargo.toml"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SVG path data and markup read better on one line.
"assets/src/build.py" = ["E501"]
